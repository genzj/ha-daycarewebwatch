[project]
name = "ha-daycarewebwatch"
version = "0.1.0"
description = "DaycareWebWatch cameras for Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # Pins the Home Assistant version the integration is tested against (2026.10.x).
    "pytest-homeassistant-custom-component==0.13.375",
    # Requirements of HA's `stream` integration (a manifest dependency).
    "av==19.0.0",
    "numpy==2.3.2",
    "PyTurboJPEG==1.8.3",
    "freezegun>=1.5.5",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
    "aiohttp-socks>=0.12.0",
]

[tool.uv]
# This repo is a Home Assistant custom integration, not an installable package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.daycarewebwatch"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S"]
"scripts/*" = ["D", "S"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["custom_components.daycarewebwatch"]
